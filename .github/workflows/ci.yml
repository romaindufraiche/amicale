name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, types, tests, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres@localhost:5432/amicale_test
      E2E_DATABASE_URL: postgres://postgres@localhost:5432/amicale_e2e
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Création des bases de test
        run: |
          psql -h localhost -U postgres -c "create database amicale_test"
          psql -h localhost -U postgres -c "create database amicale_e2e"

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - name: Migrations à jour avec le schéma
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: pnpm db:generate --name ci-check && git diff --exit-code -- drizzle
      - run: pnpm test
      - run: pnpm build
      - name: Audit des dépendances de production
        run: pnpm audit --prod --audit-level high

      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
